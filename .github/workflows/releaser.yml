name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo package version v$packageVersion"
          }

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build release
        run: cargo build --locked --release

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "target\release\mediaforge.exe" -Destination "dist\MediaForge.exe"
          (Get-FileHash "dist\MediaForge.exe" -Algorithm SHA256).Hash.ToLower() + "  MediaForge.exe" |
            Set-Content -Encoding ascii "dist\MediaForge.exe.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/MediaForge.exe
            dist/MediaForge.exe.sha256
